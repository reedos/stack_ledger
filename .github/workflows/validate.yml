name: Validate reviewed site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/evaluate_editorial.py
      - run: python scripts/evaluate_catalog.py
      - run: python scripts/evaluate_visuals.py
      - run: python scripts/build.py
      # This workflow has no publication step, credentials, or write permission.
